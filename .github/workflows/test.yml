name: Private Payment CI

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: API Tests
    runs-on: ubuntu-latest

    env:
      PROTOCOL: http
      HOST: localhost
      PORT: 4000
      GRAPHQL_PATH: /graphql
      REQUEST_TIMEOUT: 10000

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar e aguardar API
        run: |
          npm start &
          npx wait-on tcp:${{ env.HOST }}:${{ env.PORT }} --timeout 30000

      - name: Executar testes
        run: npm test
